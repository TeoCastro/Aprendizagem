services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.base44
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    command: ["sh", "/app/start-base44.sh"]
    environment:
      - DISPLAY=:1
    restart: on-failure
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
